name: deployment on Render
on:
  push:
    branches: [main]
  
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yaml # reruns the test on deploy

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Deploy on Render
      # Only run  this if branch is main
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{secrets.RENDER_DEPLOY_HOOK_URL}}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        
