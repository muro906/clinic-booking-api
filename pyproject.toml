[project]
name = "clinic-booking-api"
version = "0.1.0"
description = "A simplified backend API for clinic booking appointments"
readme = "README.md"
authors = [
    { name = "muro906", email = "mainamillicent68@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-extra-types",
    "phonenumbers",
    "pydantic-settings",
    "ruff>=0.17.1",
    "uvicorn>=0.54.0",
]
[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx"
]

[project.scripts]
clinic-booking-api = "clinic_booking_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
