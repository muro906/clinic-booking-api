name: CI pipeline
on:
  pull_request:
    branches:
      - main  # test every PR that targets main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        
        ports:
          - "5432:5432"
        options:  >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa 
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest